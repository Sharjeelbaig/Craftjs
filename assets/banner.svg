<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Craftjs — stable worlds, one block at a time</title>
  <desc id="desc">The Craftjs brand beside a small deterministic voxel world and its core world-creation options.</desc>
  <defs>
    <linearGradient id="surface" x1="50" y1="20" x2="1240" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17394a"/>
      <stop offset=".53" stop-color="#101820"/>
      <stop offset="1" stop-color="#081015"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1060 54) rotate(140) scale(470 340)">
      <stop stop-color="#53b7e8" stop-opacity=".27"/>
      <stop offset="1" stop-color="#53b7e8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M14 0 28 7 14 14 0 7Z" fill="none" stroke="#8fdfff" stroke-opacity=".055"/>
      <path d="M0 7 14 14v14M28 7 14 14" fill="none" stroke="#8fdfff" stroke-opacity=".028"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#4f8db5"/>
      <stop offset=".72" stop-color="#9ac8d7"/>
      <stop offset="1" stop-color="#f2bd73"/>
    </linearGradient>
    <clipPath id="world-clip">
      <rect x="682" y="45" width="530" height="310" rx="20"/>
    </clipPath>
    <g id="voxel">
      <path d="M14 0 28 7 14 14 0 7Z" fill="#8fdfff"/>
      <path d="M0 7 14 14v16L0 23Z" fill="#53b7e8"/>
      <path d="m14 14 14-7v16l-14 7Z" fill="#277c99"/>
    </g>
    <g id="next-voxel">
      <path d="M10 0 20 5 10 10 0 5Z" fill="#ffe59a"/>
      <path d="m0 5 10 5v12L0 17Z" fill="#f6c85f"/>
      <path d="m10 10 10-5v12l-10 5Z" fill="#d89d28"/>
    </g>
    <g id="grass-block">
      <path d="M25 0 50 12.5 25 25 0 12.5Z" fill="#a7d948"/>
      <path d="M0 12.5 25 25v30L0 42.5Z" fill="#8a5d3b"/>
      <path d="m25 25 25-12.5v30L25 55Z" fill="#664229"/>
      <path d="M0 12.5 25 25l25-12.5" fill="none" stroke="#d2f083" stroke-opacity=".5"/>
    </g>
    <g id="water-block">
      <path d="M25 0 50 12.5 25 25 0 12.5Z" fill="#53b7e8" fill-opacity=".9"/>
      <path d="M0 12.5 25 25v24L0 36.5Z" fill="#277c9f" fill-opacity=".92"/>
      <path d="m25 25 25-12.5v24L25 49Z" fill="#174c61" fill-opacity=".92"/>
    </g>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="400" rx="30" fill="url(#surface)"/>
  <rect width="1280" height="400" rx="30" fill="url(#glow)"/>
  <rect x="22" y="22" width="1236" height="356" rx="24" fill="url(#grid)" stroke="#fff" stroke-opacity=".08"/>

  <g transform="translate(60 42) scale(.72)">
    <use href="#voxel" x="15" y="10"/>
    <use href="#voxel" x="44" y="10"/>
    <use href="#voxel" x="73" y="10"/>
    <use href="#voxel" x="15" y="39"/>
    <use href="#voxel" x="15" y="68"/>
    <use href="#voxel" x="44" y="68"/>
    <use href="#voxel" x="73" y="68"/>
    <use href="#next-voxel" x="101" y="43"/>
  </g>
  <text x="166" y="112" class="sans" fill="#f4f7f2" font-size="56" font-weight="900" letter-spacing="-3">craft<tspan fill="#8fdfff">js</tspan></text>

  <text x="62" y="206" class="sans" fill="#f4f7f2" font-size="42" font-weight="780" letter-spacing="-1.3">Stable worlds.</text>
  <text x="62" y="258" class="sans" fill="#f6c85f" font-size="42" font-weight="780" letter-spacing="-1.3">One block at a time.</text>
  <text x="64" y="300" class="sans" fill="#b8c7cf" font-size="18">A deterministic voxel sandbox for the browser.</text>

  <g transform="translate(62 326)">
    <rect width="322" height="42" rx="21" fill="#f4f7f2" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/>
    <text x="20" y="27" class="mono" fill="#f6c85f" font-size="15" font-weight="700">$</text>
    <text x="40" y="27" class="mono" fill="#f4f7f2" font-size="15" font-weight="700">npm install · npm run dev</text>
  </g>

  <g clip-path="url(#world-clip)">
    <rect x="682" y="45" width="530" height="310" fill="url(#sky)"/>
    <circle cx="1112" cy="114" r="42" fill="#f8d875"/>
    <g fill="#f4f7f2" opacity=".72">
      <rect x="746" y="92" width="76" height="16"/>
      <rect x="772" y="78" width="62" height="14"/>
      <rect x="1002" y="142" width="58" height="13"/>
      <rect x="1020" y="130" width="52" height="12"/>
    </g>

    <g transform="translate(847 178)">
      <use href="#grass-block" transform="translate(0 0)"/>
      <use href="#grass-block" transform="translate(50 25)"/>
      <use href="#grass-block" transform="translate(100 50)"/>
      <use href="#grass-block" transform="translate(-50 25)"/>
      <use href="#grass-block" transform="translate(0 50)"/>
      <use href="#grass-block" transform="translate(50 75)"/>
      <use href="#water-block" transform="translate(-100 50)"/>
      <use href="#water-block" transform="translate(-50 75)"/>
      <use href="#water-block" transform="translate(0 100)"/>

      <g transform="translate(25 -46)">
        <path d="M0 45 12 51v46L0 91Z" fill="#8a5d3b"/>
        <path d="m12 51 12-6v46l-12 6Z" fill="#664229"/>
        <path d="M12 0 52 20 12 40-28 20Z" fill="#477d35"/>
        <path d="m-28 20 40 20v34l-40-20Z" fill="#315b2d"/>
        <path d="m12 40 40-20v34L12 74Z" fill="#234a26"/>
      </g>
    </g>
    <rect x="682" y="45" width="530" height="310" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
  </g>

  <g class="mono" font-size="13" font-weight="700">
    <g transform="translate(714 66)">
      <rect width="116" height="34" rx="17" fill="#101820" fill-opacity=".78"/>
      <text x="58" y="22" text-anchor="middle" fill="#8fdfff">DEFAULT / FLAT</text>
    </g>
    <g transform="translate(842 66)">
      <rect width="92" height="34" rx="17" fill="#101820" fill-opacity=".78"/>
      <text x="46" y="22" text-anchor="middle" fill="#f4f7f2">HARDCORE</text>
    </g>
    <g transform="translate(946 66)">
      <rect width="120" height="34" rx="17" fill="#101820" fill-opacity=".78"/>
      <text x="60" y="22" text-anchor="middle" fill="#f6c85f">BONUS CHEST</text>
    </g>
  </g>
</svg>
